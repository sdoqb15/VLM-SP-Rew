## Scene Preprocessing Stage: VLM-Based Semantic Annotation.
## API key for OpenAI-compatible client.
openai_api_key: ""  # Use environment variables; credential removed from release.

## VLM-SP-Rew parameters (values match current code defaults/examples).
vlm_sp_rew_params:
  # N: number of sampled navigable points per environment.
  # collection.py --num_samples
  N: 50

  # d_min: minimum Poisson sampling radius (meters).
  # collection.py --min_distance
  d_min: 1.0

  # tau_room: similarity threshold for room-label refinement.
  # refine_room_types.py --similarity-threshold
  tau_room: 0.3

  # Delta_vis: distance bands for visible locations (graph hops).
  # value_assignment.py uses thresholds at 2 and 5.
  delta_vis: [2, 5]

  # Delta_novis: band width for non-visible locations (graph hops).
  # value_assignment.py decreases value every +5.
  delta_novis: 5

  # Alpha_k: values for visible bands (close, medium, far).
  alpha_k: [5, 4, 3]

  # Beta_k: values for non-visible bands (first few shown).
  beta_k: [2, 1, 0, -1]

  # K_vis: max number of visible bands.
  K_vis: 3

  # tau: threshold for high-value region H (V(s) >= tau).
  # training.py treats values in [5,4,3] as high.
  tau: 3

  # w_hi and w_lo: reward scaling for high vs low value transitions.
  # training.py uses separate magnitudes for high/low changes.
  w_hi: 1.0
  w_lo: 0.5

  # r_up and r_down: base rewards for value increase/decrease.
  # training.py uses high/low variants; these reflect the high-value case.
  r_up: 1.0
  r_down: -1.0

stage_defaults:
  # Shared defaults for script arguments.
  target_object: HousePlant
  target_image: goal.jpg
  analysis_dir: procthor_analysis_house1
  graph_max_distance: 1.5
  value_min_distance: 1.0
  collection_output_dir: procthor_scene_views
