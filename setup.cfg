[metadata]
name = vlm-sp-rew
version = 0.7.0
description = Scene-preprocessed semantic reward shaping for visual navigation
license = MIT

[options]
package_dir =
    = src
packages = find_namespace:
python_requires = >=3.10,<3.12
include_package_data = True
install_requires =
    numpy==1.26.4
    pillow==11.3.0
    PyYAML==6.0.2
    matplotlib==3.7.5
    scikit-learn==1.2.2
    scipy==1.10.1
    ai2thor==5.0.0
    prior==1.0.3

[options.packages.find]
where = src

[options.package_data]
vlm_sp_rew = configs/*.yaml, configs/*.json
dreamerv3 = configs.yaml

[options.extras_require]
annotation =
    openai==1.102.0
train =
    elements==3.19.1
    portal==3.7.3
    jax==0.4.33
    jaxlib==0.4.33
    ninjax==3.6.0
    optax==0.2.3
    chex==0.1.89
    einops==0.6.1
    ruamel.yaml==0.18.14
